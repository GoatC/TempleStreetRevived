<!--
  青年場廟街地圖的原始檔（2026-10-21 起）。改這個檔，再執行 node tools/render-youth-map.mjs
  產生 site/assets/img/youth-map.webp。版面和親子場地圖（site/assets/js/family.js 的 FAMILY_MAP_SVG）
  同一套座標；樣式用 site/assets/css/miao.css 的 .fmap。{{STAR 字母 x y}} 會換成 ui.js 的 npcStar()。
-->
<svg class="fmap" viewBox="0 0 700 1280" width="350" height="640" role="img" aria-label="廟街地圖示意圖，東在上、北在左。沿新莊路由上往下依序是：6 廣福宮、1 慈祐宮與斜對面的集合點林協記文化館、3 戲館巷、4 米市巷，米市巷走到底是碧江街上的潮江寺、5 武聖廟。紅色星號是 NPC 出沒地點：A 安予在潮江寺，B 山羊、嚕卡在武聖廟往西約 100 公尺的新莊路上，C 怡均在慈祐宮旁。">
        <rect class="bg" x="0" y="0" width="700" height="1280"></rect>

